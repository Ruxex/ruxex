    "crates/app-server-client",
    "crates/app-server-protocol",
    "crates/app-server-protocol-noop-macros",
    "crates/app-server-test-client",
    "crates/apply-patch",
    "crates/arg0",
    "crates/features",
    "crates/install-context",
    "crates/code-mode",
    "crates/code-mode-host",
    "crates/code-mode-protocol",
    "crates/code-mode-runtime",
    "crates/ruxex-home",
    "crates/cli",
    "crates/collaboration-mode-templates",
    "crates/config",
    "crates/config-schema",
    "crates/credential-broker",
    "crates/context-fragments",
    "crates/shell-command",
    "crates/skills",
    "crates/core",
    "crates/core-api",
    "crates/core-plugins",
    "crates/diagnostics",
    "crates/hooks",
    "crates/history",
    "crates/http-client",
    "crates/secrets",
    "crates/exec",
    "crates/file-system",
    "crates/exec-server-protocol",
