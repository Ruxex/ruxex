    "crates/ext/extension-api",
    "crates/ext/goal",
    "crates/ext/history-notes",
    "crates/ext/items",
    "crates/ext/mcp",
    "crates/ext/queue",
    "crates/ext/skills",
    "crates/ext/web-search",
    "crates/keyring-store",
    "crates/file-search",
    "crates/file-watcher",
    "crates/linux-sandbox",
    "crates/login",
    "crates/ruxex-mcp",
    "crates/mermaid",
    "crates/model-provider-info",
    "crates/provider-auth",
    "crates/models-manager",
    "crates/model-provider-contract-tests",
