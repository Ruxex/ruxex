[package]
name = "ruxex"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Provider-neutral AI agent framework for Rust applications"
readme = "README.md"
repository = "https://github.com/Ruxex/ruxex"
keywords = ["ai", "agent", "llm"]
categories = ["api-bindings", "asynchronous"]
include = [
    "/src/lib.rs",
    "/README.md",
    "/MODEL-PROVIDER.md",
    "/TUI-BRAND.md",
    "/PRODUCT-IDENTITY.md",
    "/RUSTY-V8.md",
    "/NOTICE",
    "/LICENSE",
]

[features]
default = ["full"]
full = ["app-server", "cli", "tui"]
app-server = ["dep:ruxex-app-server"]
tui = ["dep:ruxex-tui"]
cli = ["app-server", "tui", "dep:ruxex-cli"]

[dependencies]
ruxex-arg0 = { workspace = true }
ruxex-api = { workspace = true }
ruxex-app-server = { workspace = true, default-features = false, optional = true }
ruxex-cli = { workspace = true, optional = true }
ruxex-home = { workspace = true }
ruxex-http-client = { workspace = true }
ruxex-login = { workspace = true }
ruxex-model-provider = { workspace = true }
ruxex-model-provider-info = { workspace = true }
ruxex-provider-auth = { workspace = true }
ruxex-models-manager = { workspace = true }
ruxex-protocol = { workspace = true }
ruxex-tui = { workspace = true, optional = true }
ruxex-utils-home-dir = { workspace = true }

[workspace]
members = [
    "crates/agent-graph-store",
    "crates/agent-roles",
    "crates/bwrap",
    "crates/build-info",
    "crates/ansi-escape",
    "crates/attachment-store",
    "crates/async-utils",
    "crates/app-server",
    "crates/app-server-mock",
