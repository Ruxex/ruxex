[package]
name = "ruxex-exec"
version.workspace = true
edition.workspace = true
license.workspace = true
autotests = false

[[bin]]
name = "ruxex-exec"
path = "src/main.rs"

[lib]
name = "ruxex_exec"
path = "src/lib.rs"
doctest = false

[[test]]
name = "all"
path = "tests/all.rs"

[lints]
workspace = true

[dependencies]
anyhow = { workspace = true }
clap = { workspace = true, features = ["derive"] }
ruxex-arg0 = { workspace = true }
ruxex-app-server-client = { workspace = true }
ruxex-app-server-protocol = { workspace = true }
ruxex-config = { workspace = true }
ruxex-core = { workspace = true }
ruxex-features = { workspace = true }
ruxex-git-utils = { workspace = true }
ruxex-history = { workspace = true }
ruxex-login = { workspace = true }
ruxex-model-provider = { workspace = true }
ruxex-model-provider-info = { workspace = true }
ruxex-otel = { workspace = true }
ruxex-protocol = { workspace = true }
ruxex-rollout = { workspace = true }
ruxex-utils-absolute-path = { workspace = true }
ruxex-utils-cli = { workspace = true }
ruxex-utils-home-dir = { workspace = true }
ruxex-utils-path-uri = { workspace = true }
ruxex-utils-sandbox-summary = { workspace = true }
ruxex-worktree = { workspace = true }
owo-colors = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
supports-color = { workspace = true }
tokio = { workspace = true, features = [
    "io-std",
    "macros",
    "process",
    "rt-multi-thread",
    "signal",
] }
tracing = { workspace = true, features = ["log"] }
tracing-subscriber = { workspace = true, features = ["env-filter"] }
ts-rs = { workspace = true, features = [
    "uuid-impl",
    "serde-json-impl",
    "no-serde-warnings",
] }
uuid = { workspace = true }


[dev-dependencies]
ruxex-apply-patch = { workspace = true }
libc = { workspace = true }
opentelemetry = { workspace = true }
opentelemetry_sdk = { workspace = true }
pretty_assertions = { workspace = true }
tempfile = { workspace = true }
tracing-opentelemetry = { workspace = true }
uuid = { workspace = true }
walkdir = { workspace = true }
zstd = { workspace = true }
