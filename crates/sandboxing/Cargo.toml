[package]
name = "genex-sandboxing"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "genex_sandboxing"
path = "src/lib.rs"
doctest = false

[lints]
workspace = true

[dependencies]
anyhow = { workspace = true }
genex-network-proxy = { workspace = true }
genex-protocol = { workspace = true }
genex-uds = { workspace = true }
genex-utils-absolute-path = { workspace = true }
genex-utils-path-uri = { workspace = true }
genex-utils-pty = { workspace = true }
dunce = { workspace = true }
libc = { workspace = true }
serde_json = { workspace = true }
regex-lite = { workspace = true }
tokio = { workspace = true, features = ["rt", "sync"] }
tracing = { workspace = true, features = ["log"] }
url = { workspace = true }
which = { workspace = true }

[dev-dependencies]
anyhow = { workspace = true }
pretty_assertions = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt", "time"] }
