[package]
name = "genex-exec-server"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
doctest = false

[lints]
workspace = true

[dependencies]
arc-swap = { workspace = true }
base64 = { workspace = true }
bytes = { workspace = true }
clatter = { workspace = true }
genex-build-info = { workspace = true }
genex-config = { workspace = true }
genex-http-client = { workspace = true }
genex-exec-server-protocol = { workspace = true }
genex-file-system = { workspace = true }
genex-network-proxy = { workspace = true }
genex-otel = { workspace = true }
genex-protocol = { workspace = true }
genex-sandboxing = { workspace = true }
genex-shell-command = { workspace = true }
genex-utils-absolute-path = { workspace = true }
genex-utils-home-dir = { workspace = true }
genex-utils-path-uri = { workspace = true }
genex-utils-pty = { workspace = true }
dirs = { workspace = true }
futures = { workspace = true }
http = { workspace = true }
opentelemetry = { workspace = true }
prost = "0.14.3"
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
thiserror = { workspace = true }
toml = { workspace = true }
tokio = { workspace = true, features = [
    "fs",
    "io-std",
    "io-util",
    "macros",
    "net",
    "process",
    "rt-multi-thread",
    "sync",
    "time",
] }
tokio-util = { workspace = true, features = ["io", "rt"] }
tracing = { workspace = true }
url = { workspace = true }
uuid = { workspace = true, features = ["v4"] }

[target.'cfg(unix)'.dependencies]
libc = { workspace = true }
rustix = { workspace = true, features = ["fs"] }

[dev-dependencies]
anyhow = { workspace = true }
genex-exec-server-test-support = { workspace = true }
genex-test-binary-support = { workspace = true }
genex-utils-cargo-bin = { workspace = true }
ctor = { workspace = true }
http = { workspace = true }
opentelemetry_sdk = { workspace = true }
pretty_assertions = { workspace = true }
rcgen = { workspace = true }
rustls = { workspace = true }
serial_test = { workspace = true }
tempfile = { workspace = true }
test-case = "3.3.1"
tokio = { workspace = true, features = ["test-util"] }
tracing-opentelemetry = { workspace = true }
tracing-subscriber = { workspace = true }
wiremock = { workspace = true }
