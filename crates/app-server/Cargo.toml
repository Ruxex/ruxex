[package]
name = "genex-app-server"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "genex-app-server"
path = "src/main.rs"

[[bin]]
name = "genex-app-server-test-notify-capture"
path = "src/bin/notify_capture.rs"

[[bin]]
name = "exec-server"
path = "src/bin/exec_server.rs"

[lib]
name = "genex_app_server"
path = "src/lib.rs"
doctest = false

[lints]
workspace = true

[dependencies]
anyhow = { workspace = true }
base64 = { workspace = true }
axum = { workspace = true, default-features = false, features = [
    "http1",
    "json",
    "tokio",
    "ws",
] }
genex-agent-extension = { workspace = true }
genex-arg0 = { workspace = true }
genex-code-mode = { workspace = true }
genex-config = { workspace = true }
genex-network-proxy = { workspace = true }
genex-core = { workspace = true }
genex-core-plugins = { workspace = true }
genex-diagnostics = { workspace = true }
genex-home = { workspace = true }
genex-exec-server = { workspace = true }
genex-extension-api = { workspace = true }
genex-features = { workspace = true }
genex-goal-extension = { workspace = true }
genex-git-utils = { workspace = true }
genex-file-watcher = { workspace = true }
genex-hooks = { workspace = true }
genex-history-notes-extension = { workspace = true }
genex-http-client = { workspace = true }
genex-otel = { workspace = true }
genex-plugin = { workspace = true }
genex-shell-command = { workspace = true }
genex-skills = { workspace = true }
genex-skills-extension = { workspace = true }
genex-utils-cli = { workspace = true }
genex-user-verification = { workspace = true }
genex-utils-pty = { workspace = true }
genex-file-search = { workspace = true }
genex-login = { workspace = true }
genex-web-search-extension = { workspace = true }
genex-mcp = { workspace = true }
genex-mcp-extension = { workspace = true }
genex-model-provider = { workspace = true }
genex-model-provider-info = { workspace = true }
genex-models-manager = { workspace = true }
genex-providers = { workspace = true }
genex-prompts = { workspace = true }
genex-protocol = { workspace = true }
genex-queue-extension = { workspace = true }
genex-app-server-protocol = { workspace = true }
genex-app-server-transport = { workspace = true }
genex-rmcp-client = { workspace = true }
genex-rollout = { workspace = true }
genex-sandboxing = { workspace = true }
genex-state = { workspace = true }
genex-thread-store = { workspace = true }
genex-tools = { workspace = true }
genex-utils-absolute-path = { workspace = true }
genex-utils-json-to-toml = { workspace = true }
genex-utils-path-uri = { workspace = true }
chrono = { workspace = true }
clap = { workspace = true, features = ["derive"] }
futures = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
sha2 = { workspace = true }
tempfile = { workspace = true }
thiserror = { workspace = true }
time = { workspace = true }
toml = { workspace = true }
toml_edit = { workspace = true }
tokio = { workspace = true, features = [
    "io-std",
    "macros",
    "process",
    "rt-multi-thread",
    "signal",
] }
tokio-util = { workspace = true }
tracing = { workspace = true, features = ["log"] }
tracing-subscriber = { workspace = true, features = ["env-filter", "fmt", "json"] }
url = { workspace = true }
uuid = { workspace = true, features = ["serde", "v7"] }

[target.'cfg(all(target_os = "linux", target_env = "musl", any(target_arch = "x86_64", target_arch = "aarch64")))'.dependencies]
tikv-jemallocator = { workspace = true }

[dev-dependencies]
genex-uds = { workspace = true }
app_test_support = { workspace = true }
axum = { workspace = true, default-features = false, features = [
    "http1",
    "json",
    "tokio",
] }
base64 = { workspace = true }
genex-utils-cargo-bin = { workspace = true }
core_test_support = { workspace = true }
flate2 = { workspace = true }
hmac = { workspace = true }
http = { workspace = true }
opentelemetry = { workspace = true }
opentelemetry_sdk = { workspace = true }
pretty_assertions = { workspace = true }
rmcp = { workspace = true, default-features = false, features = [
    "elicitation",
    "server",
    "transport-streamable-http-server",
] }
serial_test = { workspace = true }
shlex = { workspace = true }
sqlx = { workspace = true }
tar = { workspace = true }
test-case = "3.3.1"
tokio-tungstenite = { workspace = true }
tracing-opentelemetry = { workspace = true }
wiremock = { workspace = true }
