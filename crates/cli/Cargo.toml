[package]
name = "ruxex-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
build = "build.rs"
[[bin]]
name = "logs_client"
path = "src/bin/logs_client.rs"

[lib]
name = "ruxex_cli"
path = "src/lib.rs"
doctest = false

[lints]
workspace = true

[dependencies]
anyhow = { workspace = true }
chrono = { workspace = true }
clap = { workspace = true, features = ["derive", "env"] }
clap_complete = { workspace = true }
ruxex-app-server = { workspace = true }
ruxex-app-server-daemon = { workspace = true }
ruxex-app-server-protocol = { workspace = true }
ruxex-app-server-test-client = { workspace = true }
ruxex-arg0 = { workspace = true }
ruxex-build-info = { workspace = true }
ruxex-api = { workspace = true }
ruxex-utils-cli = { workspace = true }
ruxex-config = { workspace = true }
ruxex-credential-broker = { workspace = true }
ruxex-core = { workspace = true }
ruxex-core-plugins = { workspace = true }
ruxex-history = { workspace = true }
ruxex-home = { workspace = true }
ruxex-http-client = { workspace = true }
ruxex-exec = { workspace = true }
ruxex-exec-server = { workspace = true }
ruxex-execpolicy = { workspace = true }
ruxex-extension-api = { workspace = true }
ruxex-features = { workspace = true }
ruxex-git-utils = { workspace = true }
ruxex-install-context = { workspace = true }
ruxex-login = { workspace = true }
ruxex-mcp = { workspace = true }
ruxex-model-provider = { workspace = true }
ruxex-models-manager = { workspace = true }
ruxex-network-proxy = { workspace = true }
ruxex-plugin = { workspace = true }
ruxex-protocol = { workspace = true }
ruxex-tcp-tunnel = { workspace = true }
ruxex-rmcp-client = { workspace = true }
ruxex-rollout = { workspace = true }
ruxex-rollout-trace = { workspace = true }
ruxex-sandboxing = { workspace = true }
ruxex-skills-extension = { workspace = true }
ruxex-state = { workspace = true }
ruxex-stdio-to-uds = { workspace = true }
ruxex-terminal-detection = { workspace = true }
ruxex-thread-store = { workspace = true }
ruxex-tui = { workspace = true }
ruxex-utils-absolute-path = { workspace = true }
ruxex-utils-home-dir = { workspace = true }
ruxex-utils-path = { workspace = true }
ruxex-utils-path-uri = { workspace = true }
crossterm = { workspace = true, features = ["event-stream"] }
futures = { workspace = true }
http = { workspace = true }
libc = { workspace = true }
os_info = { workspace = true }
owo-colors = { workspace = true }
regex-lite = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
supports-color = { workspace = true }
sys-locale = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = [
    "io-std",
    "macros",
    "net",
    "process",
    "rt-multi-thread",
    "signal",
    "time",
] }
toml = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
unicode-segmentation = { workspace = true }
url = { workspace = true }
which = { workspace = true }

[target.'cfg(all(target_os = "linux", target_env = "musl", any(target_arch = "x86_64", target_arch = "aarch64")))'.dependencies]
tikv-jemallocator = { workspace = true }

[dev-dependencies]
ruxex-utils-pty = { workspace = true }
flate2 = { workspace = true }
insta = { workspace = true }
pretty_assertions = { workspace = true }
sqlx = { workspace = true }
tar = { workspace = true }
tokio-tungstenite = { workspace = true }
zstd = { workspace = true }
