[package]
name = "genex-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
build = "build.rs"
default-run = "genex"

[[bin]]
name = "genex"
path = "src/main.rs"

[[bin]]
name = "logs_client"
path = "src/bin/logs_client.rs"

[lib]
name = "genex_cli"
path = "src/lib.rs"
doctest = false

[lints]
workspace = true

[dependencies]
anyhow = { workspace = true }
chrono = { workspace = true }
clap = { workspace = true, features = ["derive", "env"] }
clap_complete = { workspace = true }
genex-app-server = { workspace = true }
genex-app-server-daemon = { workspace = true }
genex-app-server-protocol = { workspace = true }
genex-app-server-test-client = { workspace = true }
genex-arg0 = { workspace = true }
genex-build-info = { workspace = true }
genex-api = { workspace = true }
genex-utils-cli = { workspace = true }
genex-config = { workspace = true }
genex-credential-broker = { workspace = true }
genex-core = { workspace = true }
genex-core-plugins = { workspace = true }
genex-history = { workspace = true }
genex-home = { workspace = true }
genex-http-client = { workspace = true }
genex-exec = { workspace = true }
genex-exec-server = { workspace = true }
genex-execpolicy = { workspace = true }
genex-extension-api = { workspace = true }
genex-features = { workspace = true }
genex-git-utils = { workspace = true }
genex-install-context = { workspace = true }
genex-login = { workspace = true }
genex-mcp = { workspace = true }
genex-model-provider = { workspace = true }
genex-models-manager = { workspace = true }
genex-network-proxy = { workspace = true }
genex-plugin = { workspace = true }
genex-protocol = { workspace = true }
genex-tcp-tunnel = { workspace = true }
genex-rmcp-client = { workspace = true }
genex-rollout = { workspace = true }
genex-rollout-trace = { workspace = true }
genex-sandboxing = { workspace = true }
genex-skills-extension = { workspace = true }
genex-state = { workspace = true }
genex-stdio-to-uds = { workspace = true }
genex-terminal-detection = { workspace = true }
genex-thread-store = { workspace = true }
genex-tui = { workspace = true }
genex-utils-absolute-path = { workspace = true }
genex-utils-path = { workspace = true }
genex-utils-path-uri = { workspace = true }
crossterm = { workspace = true, features = ["event-stream"] }
futures = { workspace = true }
http = { workspace = true }
libc = { workspace = true }
os_info = { workspace = true }
owo-colors = { workspace = true }
regex-lite = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
supports-color = { workspace = true }
sys-locale = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = [
    "io-std",
    "macros",
    "net",
    "process",
    "rt-multi-thread",
    "signal",
    "time",
] }
toml = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
unicode-segmentation = { workspace = true }
url = { workspace = true }
which = { workspace = true }

[target.'cfg(all(target_os = "linux", target_env = "musl", any(target_arch = "x86_64", target_arch = "aarch64")))'.dependencies]
tikv-jemallocator = { workspace = true }

[dev-dependencies]
app_test_support = { workspace = true }
assert_cmd = { workspace = true }
assert_matches = { workspace = true }
genex-utils-cargo-bin = { workspace = true }
genex-utils-pty = { workspace = true }
flate2 = { workspace = true }
insta = { workspace = true }
predicates = { workspace = true }
pretty_assertions = { workspace = true }
sqlx = { workspace = true }
tar = { workspace = true }
tokio-tungstenite = { workspace = true }
vt100 = { workspace = true }
wiremock = { workspace = true }
zstd = { workspace = true }
