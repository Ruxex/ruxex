[package]
name = "genex-app-server-client"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "genex_app_server_client"
path = "src/lib.rs"
doctest = false

[lints]
workspace = true

[dependencies]
genex-app-server = { workspace = true }
genex-app-server-protocol = { workspace = true }
genex-arg0 = { workspace = true }
genex-config = { workspace = true }
genex-core = { workspace = true }
genex-exec-server = { workspace = true }
genex-protocol = { workspace = true }
genex-uds = { workspace = true }
genex-utils-absolute-path = { workspace = true }
genex-utils-rustls-provider = { workspace = true }
futures = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["sync", "time", "rt"] }
tokio-tungstenite = { workspace = true }
toml = { workspace = true }
tracing = { workspace = true }
url = { workspace = true }

[dev-dependencies]
pretty_assertions = { workspace = true }
serde_json = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
