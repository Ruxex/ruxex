[package]
edition.workspace = true
license.workspace = true
name = "genex-thread-store"
version.workspace = true

[lib]
name = "genex_thread_store"
path = "src/lib.rs"
doctest = false

[lints]
workspace = true

[dependencies]
chrono = { workspace = true, features = ["serde"] }
genex-app-server-protocol = { workspace = true }
genex-extension-items = { workspace = true }
genex-git-utils = { workspace = true }
genex-install-context = { workspace = true }
genex-otel = { workspace = true }
genex-protocol = { workspace = true }
genex-rollout = { workspace = true }
genex-state = { workspace = true }
genex-utils-absolute-path = { workspace = true }
genex-utils-path = { workspace = true }
genex-utils-path-uri = { workspace = true }
futures = { workspace = true }
pulldown-cmark = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
sqlx = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
zstd = { workspace = true }

[dev-dependencies]
genex-utils-absolute-path = { workspace = true }
pretty_assertions = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
uuid = { workspace = true }
