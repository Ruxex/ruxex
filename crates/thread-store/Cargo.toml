[package]
edition.workspace = true
license.workspace = true
name = "ruxex-thread-store"
version.workspace = true

[lib]
name = "ruxex_thread_store"
path = "src/lib.rs"
doctest = false

[lints]
workspace = true

[dependencies]
chrono = { workspace = true, features = ["serde"] }
ruxex-app-server-protocol = { workspace = true }
ruxex-git-utils = { workspace = true }
ruxex-install-context = { workspace = true }
ruxex-otel = { workspace = true }
ruxex-protocol = { workspace = true }
ruxex-rollout = { workspace = true }
ruxex-state = { workspace = true }
ruxex-utils-absolute-path = { workspace = true }
ruxex-utils-path = { workspace = true }
futures = { workspace = true }
pulldown-cmark = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
sqlx = { workspace = true }
sqlx-macros = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
zstd = { workspace = true }

[dev-dependencies]
ruxex-utils-absolute-path = { workspace = true }
pretty_assertions = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
uuid = { workspace = true }
