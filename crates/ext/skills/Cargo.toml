[package]
edition.workspace = true
license.workspace = true
name = "genex-skills-extension"
version.workspace = true

[lib]
name = "genex_skills_extension"
path = "src/lib.rs"
doctest = false

[lints]
workspace = true

[dependencies]
genex-config = { workspace = true }
genex-exec-server = { workspace = true }
genex-extension-api = { workspace = true }
genex-mcp = { workspace = true }
genex-otel = { workspace = true }
genex-protocol = { workspace = true }
genex-skills = { workspace = true }
genex-tools = { workspace = true }
genex-utils-absolute-path = { workspace = true }
genex-utils-path-uri = { workspace = true }
genex-utils-plugins = { workspace = true }
genex-utils-string = { workspace = true }
dirs = { workspace = true }
futures = { workspace = true }
schemars = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
tokio = { workspace = true, features = ["sync", "time"] }
toml = { workspace = true }
tracing = { workspace = true }
url = { workspace = true }

[dev-dependencies]
assert_matches = { workspace = true }
genex-models-manager = { workspace = true }
genex-utils-cargo-bin = { workspace = true }
dunce = { workspace = true }
insta = { workspace = true }
opentelemetry_sdk = { workspace = true }
pretty_assertions = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
