[package]
edition.workspace = true
license.workspace = true
name = "ruxex-skills-extension"
version.workspace = true

[lib]
name = "ruxex_skills_extension"
path = "src/lib.rs"
doctest = false

[lints]
workspace = true

[dependencies]
ruxex-config = { workspace = true }
ruxex-exec-server = { workspace = true }
ruxex-extension-api = { workspace = true }
ruxex-mcp = { workspace = true }
ruxex-otel = { workspace = true }
ruxex-protocol = { workspace = true }
ruxex-skills = { workspace = true }
ruxex-tools = { workspace = true }
ruxex-utils-absolute-path = { workspace = true }
ruxex-utils-path-uri = { workspace = true }
ruxex-utils-plugins = { workspace = true }
ruxex-utils-string = { workspace = true }
dirs = { workspace = true }
futures = { workspace = true }
schemars = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
tokio = { workspace = true, features = ["sync", "time"] }
toml = { workspace = true }
tracing = { workspace = true }
url = { workspace = true }

[dev-dependencies]
assert_matches = { workspace = true }
ruxex-models-manager = { workspace = true }
ruxex-utils-cargo-bin = { workspace = true }
dunce = { workspace = true }
insta = { workspace = true }
opentelemetry_sdk = { workspace = true }
pretty_assertions = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
