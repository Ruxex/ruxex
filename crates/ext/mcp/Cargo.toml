[package]
edition.workspace = true
license.workspace = true
name = "genex-mcp-extension"
version.workspace = true

[lib]
name = "genex_mcp_extension"
path = "src/lib.rs"
doctest = false

[lints]
workspace = true

[dependencies]
anyhow = { workspace = true }
genex-core = { workspace = true }
genex-core-plugins = { workspace = true }
genex-config = { workspace = true }
genex-exec-server = { workspace = true }
genex-extension-api = { workspace = true }
genex-features = { workspace = true }
genex-mcp = { workspace = true }
genex-plugin = { workspace = true }
genex-protocol = { workspace = true }
genex-utils-absolute-path = { workspace = true }
genex-utils-path-uri = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tokio = { workspace = true, features = ["sync"] }

[dev-dependencies]
axum = { workspace = true }
genex-exec-server-test-support = { workspace = true }
genex-login = { workspace = true }
futures = { workspace = true }
pretty_assertions = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
tokio-util = { workspace = true, features = ["rt"] }
