[package]
edition.workspace = true
license.workspace = true
name = "ruxex-mcp-extension"
version.workspace = true

[lib]
name = "ruxex_mcp_extension"
path = "src/lib.rs"
doctest = false

[lints]
workspace = true

[dependencies]
anyhow = { workspace = true }
ruxex-core = { workspace = true }
ruxex-core-plugins = { workspace = true }
ruxex-config = { workspace = true }
ruxex-exec-server = { workspace = true }
ruxex-extension-api = { workspace = true }
ruxex-features = { workspace = true }
ruxex-mcp = { workspace = true }
ruxex-plugin = { workspace = true }
ruxex-protocol = { workspace = true }
ruxex-utils-absolute-path = { workspace = true }
ruxex-utils-path-uri = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tokio = { workspace = true, features = ["sync"] }

[dev-dependencies]
axum = { workspace = true }
ruxex-login = { workspace = true }
futures = { workspace = true }
pretty_assertions = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
tokio-util = { workspace = true, features = ["rt"] }
