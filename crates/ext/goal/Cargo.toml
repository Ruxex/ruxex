[package]
edition.workspace = true
license.workspace = true
name = "genex-goal-extension"
version.workspace = true

[lib]
name = "genex_goal_extension"
path = "src/lib.rs"
test = false
doctest = false

[lints]
workspace = true

[dependencies]
genex-core = { workspace = true }
genex-extension-api = { workspace = true }
genex-otel = { workspace = true }
genex-prompts = { workspace = true }
genex-protocol = { workspace = true }
genex-rollout = { workspace = true }
genex-state = { workspace = true }
genex-tools = { workspace = true }
genex-utils-template = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["sync"] }
tracing = { workspace = true }

[dev-dependencies]
anyhow = { workspace = true }
chrono = { workspace = true }
genex-utils-absolute-path = { workspace = true }
pretty_assertions = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
