[package]
edition.workspace = true
license.workspace = true
name = "ruxex-goal-extension"
version.workspace = true

[lib]
name = "ruxex_goal_extension"
path = "src/lib.rs"
test = false
doctest = false

[lints]
workspace = true

[dependencies]
ruxex-core = { workspace = true }
ruxex-extension-api = { workspace = true }
ruxex-otel = { workspace = true }
ruxex-prompts = { workspace = true }
ruxex-protocol = { workspace = true }
ruxex-rollout = { workspace = true }
ruxex-state = { workspace = true }
ruxex-tools = { workspace = true }
ruxex-utils-template = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["sync"] }
tracing = { workspace = true }

[dev-dependencies]
anyhow = { workspace = true }
chrono = { workspace = true }
ruxex-utils-absolute-path = { workspace = true }
pretty_assertions = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
