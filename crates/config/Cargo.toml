[package]
name = "ruxex-config"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
anyhow = { workspace = true }
base64 = { workspace = true }
ruxex-execpolicy = { workspace = true }
ruxex-features = { workspace = true }
ruxex-file-system = { workspace = true }
ruxex-git-utils = { workspace = true }
ruxex-model-provider-info = { workspace = true }
ruxex-network-proxy = { workspace = true }
ruxex-protocol = { workspace = true }
ruxex-utils-absolute-path = { workspace = true }
ruxex-utils-path = { workspace = true }
ruxex-utils-path-uri = { workspace = true }
dunce = { workspace = true }
gethostname = { workspace = true }
indexmap = { workspace = true, features = ["serde"] }
multimap = { workspace = true }
regex-lite = { workspace = true }
schemars = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_ignored = { workspace = true }
serde_json = { workspace = true }
serde_path_to_error = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["fs"] }
toml = { workspace = true, features = ["preserve_order"] }
toml_edit = { workspace = true }
tracing = { workspace = true }
wildmatch = { workspace = true }

[target.'cfg(unix)'.dependencies]
dns-lookup = { workspace = true }
libc = { workspace = true }

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.9"

[dev-dependencies]
pretty_assertions = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["full"] }

[lib]
doctest = false
