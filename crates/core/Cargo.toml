genex-client = { workspace = true }
genex-code-mode = { workspace = true }
genex-context-fragments = { workspace = true }
genex-config = { workspace = true }
genex-core-plugins = { workspace = true }
genex-diagnostics = { workspace = true }
genex-exec-server = { workspace = true }
genex-extension-api = { workspace = true }
genex-extension-items = { workspace = true }
genex-features = { workspace = true }
genex-file-system = { workspace = true }
genex-login = { workspace = true }
genex-mcp = { workspace = true }
genex-model-provider-info = { workspace = true }
genex-models-manager = { workspace = true }
genex-shell-command = { workspace = true }
genex-execpolicy = { workspace = true }
genex-git-utils = { workspace = true }
genex-history = { workspace = true }
genex-hooks = { workspace = true }
genex-http-client = { workspace = true }
genex-install-context = { workspace = true }
genex-network-proxy = { workspace = true }
genex-otel = { workspace = true }
genex-plugin = { workspace = true }
genex-model-provider = { workspace = true }
genex-protocol = { workspace = true }
genex-response-debug-context = { workspace = true }
genex-prompts = { workspace = true }
