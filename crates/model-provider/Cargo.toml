[package]
edition.workspace = true
license.workspace = true
name = "genex-model-provider"
version.workspace = true

[lib]
doctest = false
name = "genex_model_provider"
path = "src/lib.rs"

[lints]
workspace = true

[dependencies]
chrono = { workspace = true }
futures = { workspace = true }
genex-api = { workspace = true }
genex-http-client = { workspace = true }
genex-login = { workspace = true }
genex-model-provider-info = { workspace = true }
genex-models-manager = { workspace = true }
genex-otel = { workspace = true }
genex-protocol = { workspace = true }
genex-response-debug-context = { workspace = true }
http = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["io-util", "process", "sync", "time"] }
tokio-tungstenite = { workspace = true }
tracing = { workspace = true, features = ["log"] }
url = { workspace = true }

[dev-dependencies]
base64 = { workspace = true }
genex-utils-redacted-string = { workspace = true }
pretty_assertions = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt"] }
wiremock = { workspace = true }
