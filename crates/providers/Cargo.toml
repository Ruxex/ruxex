[package]
name = "ruxex-providers"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
doctest = false
name = "ruxex_providers"
path = "src/lib.rs"

[lints]
workspace = true

[dependencies]
ruxex-api = { workspace = true }
ruxex-http-client = { workspace = true }
ruxex-login = { workspace = true }
ruxex-model-provider = { workspace = true }
ruxex-model-provider-info = { workspace = true }
ruxex-models-manager = { workspace = true }
ruxex-otel = { workspace = true }
ruxex-protocol = { workspace = true }
ruxex-response-debug-context = { workspace = true }
futures = { workspace = true }
http = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["io-util", "process", "sync", "time"] }
tokio-tungstenite = { workspace = true }
tracing = { workspace = true, features = ["log"] }
url = { workspace = true }
uuid = { workspace = true, features = ["v4"] }

[dev-dependencies]
base64 = { workspace = true }
ruxex-utils-redacted-string = { workspace = true }
pretty_assertions = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt"] }
wiremock = { workspace = true }
