[package]
name = "genex-external-agent-migration"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
doctest = false
name = "genex_external_agent_migration"
path = "src/lib.rs"

[lints]
workspace = true

[dependencies]
chrono = { workspace = true }
genex-config = { workspace = true }
genex-core = { workspace = true }
genex-core-plugins = { workspace = true }
genex-hooks = { workspace = true }
genex-login = { workspace = true }
genex-otel = { workspace = true }
genex-plugin = { workspace = true }
genex-protocol = { workspace = true }
genex-rollout = { workspace = true }
genex-thread-store = { workspace = true }
genex-utils-output-truncation = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
sha2 = { workspace = true }
toml = { workspace = true }
tokio = { workspace = true, features = ["rt", "sync"] }
tracing = { workspace = true }

[dev-dependencies]
genex-app-server-protocol = { workspace = true }
pretty_assertions = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
