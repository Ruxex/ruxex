name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_BUILD_JOBS: 2

jobs:
  build:
    name: build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - macos-14

    steps:
      - name: Check out source
        uses: actions/checkout@v4.2.2

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes binutils build-essential clang cmake file just libayatana-appindicator3-dev libcap-dev libglib2.0-dev libgtk-3-dev libssl-dev libwebkit2gtk-4.1-dev libxdo-dev librsvg2-dev mold pkg-config wget

      - name: Install macOS dependencies
        if: runner.os == 'macOS'
        run: brew install cmake just pkg-config

      - name: Select repository Rust toolchain
        run: |
          rustup toolchain install 1.98.1 --profile minimal \
            --component clippy --component rustfmt --component rust-src
          rustup default 1.98.1
          rustc --version --verbose

      - name: Restore Cargo and native artifact caches
        uses: actions/cache@v4.2.3
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            .build-cache/rusty-v8
          key: ${{ runner.os }}-rust-1.98.1-deps-v3-${{ hashFiles('Cargo.lock', 'third_party/v8/*') }}
          restore-keys: |
            ${{ runner.os }}-rust-1.98.1-deps-v3-

      - name: Restore target cache for build probe
        uses: actions/cache@v4.2.3
        with:
          path: target
          key: ${{ runner.os }}-rust-1.98.1-target-probe-v2-${{ hashFiles('Cargo.lock', 'third_party/v8/*') }}
          restore-keys: |
            ${{ runner.os }}-rust-1.98.1-target-probe-v2-

      - name: Inspect disk after cache restore
        run: |
          df -h .
          for path in target .build-cache/rusty-v8 ~/.cargo/registry ~/.cargo/git; do
            if [ -e "$path" ]; then
              du -sh "$path"
            fi
          done

      - name: Check production targets
        run: just check

      - name: Build workspace
        run: just build --workspace

  test-archive:
    name: test archive (${{ matrix.os }}, ${{ matrix.group }})
    runs-on: ${{ matrix.os == 'macos' && 'macos-14' || 'ubuntu-24.04' }}
    env:
      CARGO_INCREMENTAL: 0
    strategy:
      fail-fast: false
      matrix:
        os:
          - linux
          - macos
        group:
          - core
          - app
          - runtime
        include:
          - group: core
            filter: >-
              package(ruxex-core*) |
              package(ruxex-config*) |
              package(ruxex-state) |
              package(ruxex-history) |
              package(ruxex-thread-store) |
              package(ruxex-message-history) |
              package(ruxex-model*) |
              package(ruxex-providers) |
              package(ruxex-protocol) |
              package(ruxex-api) |
              package(ruxex-context-fragments) |
              package(ruxex-prompts) |
              package(ruxex-rollout*) |
              package(core_test_support) |
              package(ruxex-agent-graph-store) |
              package(ruxex-agent-roles) |
              package(ruxex-attachment-store) |
              package(ruxex-provider-host-example)
          - group: app
            filter: >-
              package(ruxex-app-server*) |
              package(ruxex-cli) |
              package(ruxex-tui) |
              package(ruxex-code-mode*) |
              package(ruxex-plugin) |
              package(ruxex-skills*) |
              package(ruxex-tools) |
              package(ruxex-extension*) |
              package(ruxex-*-extension) |
              package(ruxex-mcp) |
              package(ruxex-rmcp-client) |
              package(ruxex-desktop) |
              package(app_test_support)
          - group: runtime
            filter: >-
              not (
                package(ruxex-core*) |
                package(ruxex-config*) |
                package(ruxex-state) |
                package(ruxex-history) |
                package(ruxex-thread-store) |
                package(ruxex-message-history) |
                package(ruxex-model*) |
                package(ruxex-providers) |
                package(ruxex-protocol) |
                package(ruxex-api) |
                package(ruxex-context-fragments) |
                package(ruxex-prompts) |
                package(ruxex-rollout*) |
                package(core_test_support) |
                package(ruxex-agent-graph-store) |
                package(ruxex-agent-roles) |
                package(ruxex-attachment-store) |
                package(ruxex-provider-host-example) |
                package(ruxex-app-server*) |
                package(ruxex-cli) |
                package(ruxex-tui) |
                package(ruxex-code-mode*) |
                package(ruxex-plugin) |
                package(ruxex-skills*) |
                package(ruxex-tools) |
                package(ruxex-extension*) |
                package(ruxex-*-extension) |
                package(ruxex-mcp) |
                package(ruxex-rmcp-client) |
                package(ruxex-desktop) |
                package(app_test_support)
              )

    steps:
      - name: Check out source
        uses: actions/checkout@v4.2.2

      - name: Install Linux dependencies
        if: matrix.os == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes binutils build-essential clang cmake file just libayatana-appindicator3-dev libcap-dev libglib2.0-dev libgtk-3-dev libssl-dev libwebkit2gtk-4.1-dev libxdo-dev librsvg2-dev mold pkg-config wget

      - name: Install macOS dependencies
        if: matrix.os == 'macos'
        run: brew install cmake just pkg-config

      - name: Select repository Rust toolchain
        run: |
          rustup toolchain install 1.98.1 --profile minimal \
            --component clippy --component rustfmt --component rust-src
          rustup default 1.98.1
          rustc --version --verbose

      - name: Restore Cargo and native artifact caches
        uses: actions/cache@v4.2.3
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            .build-cache/rusty-v8
          key: ${{ runner.os }}-rust-1.98.1-deps-v3-${{ hashFiles('Cargo.lock', 'third_party/v8/*') }}
          restore-keys: |
            ${{ runner.os }}-rust-1.98.1-deps-v3-

      - name: Inspect disk before archive build
        run: |
          df -h .
          for path in target .build-cache/rusty-v8 ~/.cargo/registry ~/.cargo/git; do
            if [ -e "$path" ]; then
              du -sh "$path"
            fi
          done

      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2.62.49
        with:
          tool: nextest
          version: 0.9.103

      - name: Build nextest archive
        env:
          NEXTEST_FILTERSET: ${{ matrix.filter }}
        run: |
          mkdir -p "$RUNNER_TEMP/ruxex-nextest"
          just test-archive \
            "$RUNNER_TEMP/ruxex-nextest/ruxex-nextest-${{ matrix.os }}-${{ matrix.group }}.tar.zst" \
            "$NEXTEST_FILTERSET"

      - name: Inspect disk after archive build
        if: always()
        run: |
          df -h .
          for path in target .build-cache/rusty-v8 ~/.cargo/registry ~/.cargo/git; do
            if [ -e "$path" ]; then
              du -sh "$path"
            fi
          done
          if [ -d "$RUNNER_TEMP/ruxex-nextest" ]; then
            du -sh "$RUNNER_TEMP/ruxex-nextest"/* 2>/dev/null || true
          fi

      - name: Upload nextest archive
        uses: actions/upload-artifact@v4.6.2
        with:
          name: ruxex-nextest-${{ matrix.os }}-${{ matrix.group }}
          path: ${{ runner.temp }}/ruxex-nextest/ruxex-nextest-${{ matrix.os }}-${{ matrix.group }}.tar.zst
          if-no-files-found: error
          retention-days: 1

  test-shard:
    name: test group (${{ matrix.os }}, ${{ matrix.group }})
    needs:
      - build
      - test-archive
    if: ${{ needs.build.result == 'success' && needs.test-archive.result == 'success' }}
    runs-on: ${{ matrix.os == 'macos' && 'macos-14' || 'ubuntu-24.04' }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - linux
          - macos
        group:
          - core
          - app
          - runtime

    steps:
      - name: Check out source
        uses: actions/checkout@v4.2.2

      - name: Install Linux dependencies
        if: matrix.os == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes binutils build-essential clang cmake file just libayatana-appindicator3-dev libcap-dev libglib2.0-dev libgtk-3-dev libssl-dev libwebkit2gtk-4.1-dev libxdo-dev librsvg2-dev mold pkg-config wget

      - name: Install macOS dependencies
        if: matrix.os == 'macos'
        run: brew install cmake just pkg-config

      - name: Select repository Rust toolchain
        run: |
          rustup toolchain install 1.98.1 --profile minimal \
            --component clippy --component rustfmt --component rust-src
          rustup default 1.98.1
          rustc --version --verbose

      - name: Restore Cargo and native artifact caches
        uses: actions/cache@v4.2.3
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            .build-cache/rusty-v8
          key: ${{ runner.os }}-rust-1.98.1-deps-v3-${{ hashFiles('Cargo.lock', 'third_party/v8/*') }}
          restore-keys: |
            ${{ runner.os }}-rust-1.98.1-deps-v3-

      - name: Inspect disk before test group
        run: |
          df -h .
          for path in target .build-cache/rusty-v8 ~/.cargo/registry ~/.cargo/git; do
            if [ -e "$path" ]; then
              du -sh "$path"
            fi
          done

      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2.62.49
        with:
          tool: nextest
          version: 0.9.103

      - name: Download nextest archive
        uses: actions/download-artifact@v4.3.0
        with:
          name: ruxex-nextest-${{ matrix.os }}-${{ matrix.group }}
          path: ${{ runner.temp }}/ruxex-nextest

      - name: Run test group
        run: |
          just test-archive-run \
            "$RUNNER_TEMP/ruxex-nextest/ruxex-nextest-${{ matrix.os }}-${{ matrix.group }}.tar.zst"
