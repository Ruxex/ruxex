[package]
name = "ruxex-provider-host-example"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[features]
default = []
dummy-provider = ["dep:ruxex-login", "dep:ruxex-models-manager"]

[[bin]]
name = "ruxex-provider-host-example"
path = "src/main.rs"

[lib]
name = "ruxex_provider_host_example"
path = "src/lib.rs"

[dependencies]
anyhow = { workspace = true }
futures = { workspace = true }
http = { workspace = true }
ruxex = { path = "../.." }
ruxex-arg0 = { workspace = true }
ruxex-app-server = { workspace = true }
ruxex-cli = { workspace = true }
ruxex-model-provider = { workspace = true }
ruxex-model-provider-info = { workspace = true }
ruxex-providers = { workspace = true }
ruxex-login = { workspace = true, optional = true }
ruxex-models-manager = { workspace = true, optional = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["time"] }

[dev-dependencies]
tempfile = { workspace = true }
